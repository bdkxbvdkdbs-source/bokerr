plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.bokerr'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.bokerr'
        minSdk 21
        targetSdk 35
        versionCode providers.environmentVariable('ANDROID_VERSION_CODE').getOrElse('1').toInteger()
        versionName providers.environmentVariable('BOKERR_VERSION_NAME').getOrElse('1.0.0').replaceFirst('^v', '')
        def apiBaseUrl = providers.gradleProperty('BOKERR_API_BASE_URL').orElse(providers.environmentVariable('BOKERR_API_BASE_URL')).getOrElse('')
        buildConfigField 'String', 'API_BASE_URL', '\"' + apiBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"') + '\"'
    }

    def keystorePath = providers.environmentVariable('ANDROID_KEYSTORE_PATH').getOrElse('')
    def keystorePassword = providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').getOrElse('')
    def releaseKeyAlias = providers.environmentVariable('ANDROID_KEY_ALIAS').getOrElse('')
    def releaseKeyPassword = providers.environmentVariable('ANDROID_KEY_PASSWORD').getOrElse('')
    def keystoreFileAvailable = !keystorePath.isBlank() && file(keystorePath).isFile()
    def releaseSigningConfigured = keystoreFileAvailable && [keystorePassword, releaseKeyAlias, releaseKeyPassword].every { !it.isBlank() }
    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
