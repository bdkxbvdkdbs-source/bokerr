name: Android Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.PASTE_ANDROID_KEYSTORE_BASE64_HERE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BOKERR_API_BASE_URL: ${{ vars.BOKERR_API_BASE_URL || 'https://bokerr-api.bdkxbvdkdbs.workers.dev' }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done
          case "$BOKERR_API_BASE_URL" in
            https://*) ;;
            *) echo "Set repository variable BOKERR_API_BASE_URL to the production HTTPS API URL." >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android/release.keystore"
          test -s "$RUNNER_TEMP/android/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed production APK and AAB
        env:
          BOKERR_API_BASE_URL: ${{ vars.BOKERR_API_BASE_URL || 'https://bokerr-api.bdkxbvdkdbs.workers.dev' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          BOKERR_VERSION_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Publish APK and AAB to GitHub Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          AAB="mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          gh release create "$TAG_NAME" "$APK" "$AAB" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Bokerr Android ${TAG_NAME}" \
            --generate-notes
