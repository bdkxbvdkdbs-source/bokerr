name: Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --no-daemon
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: bokerr-android-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
